name: Build & Verify Goo Engine 5.2.4 Releases

on:
  push:
    branches:
      - goo-port
    tags:
      - "v*-goo*"
    paths-ignore:
      - ".github/**"
      - "README.md"
      - "doc/goo-evidence/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goo-releases-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHIVE_VERSION: "5.2.4-goo"

jobs:
  linux-x64:
    name: Linux x64 (OpenGL + Vulkan + Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Linux build & headless GPU QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-lfs \
            build-essential \
            ccache \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            mold \
            pkg-config \
            python3 \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxfixes-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libegl-dev \
            libgl-dev \
            libgl1-mesa-dri \
            libjack-jackd2-dev \
            libpulse-dev \
            libdbus-1-dev \
            xvfb \
            mesa-utils \
            mesa-vulkan-drivers \
            vulkan-tools \
            xz-utils

      - name: Checkout Blender Goo Engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Pull bundled LFS assets and precompiled lib/linux_x64
        run: |
          set -euo pipefail
          git lfs install --skip-repo
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git lfs pull --exclude="tests/**"
          STARTUP_SIZE="$(wc -c < release/datafiles/startup.blend)"
          echo "release/datafiles/startup.blend size: $STARTUP_SIZE bytes"
          test "$STARTUP_SIZE" -gt 1024
          rm -rf .git/lfs

          git config --local submodule.lib/linux_x64.update checkout
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 --progress lib/linux_x64
          git -C lib/linux_x64 lfs pull
          if [ -d lib/linux_x64/.git/lfs ]; then rm -rf lib/linux_x64/.git/lfs; fi
          rm -rf .git/modules/lib/linux_x64/lfs
          test -e lib/linux_x64/.git
          df -h

      - name: Restore Linux ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-${{ github.sha }}
          restore-keys: |
            ccache-linux-x64-

      - name: Configure Linux Release build
        run: |
          set -o pipefail
          export CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! cmake -S . -B "$RUNNER_TEMP/build-linux" -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -C build_files/cmake/config/blender_release.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_COMPILER_CCACHE=ON \
            -DWITH_LINKER_MOLD=ON \
            -DWITH_DOC_MANPAGE=OFF \
            -DWITH_OPENGL_BACKEND=ON \
            -DWITH_VULKAN_BACKEND=ON \
            -DWITH_CYCLES_CUDA_BINARIES=OFF \
            -DWITH_CYCLES_HIP_BINARIES=OFF \
            -DWITH_CYCLES_ONEAPI_BINARIES=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIPRT=OFF \
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pkg/blender-${{ env.ARCHIVE_VERSION }}-linux-x64" 2>&1 | tee "$RUNNER_TEMP/cmake-linux.log"; then
            MSG="$(tail -n 25 "$RUNNER_TEMP/cmake-linux.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Configure Linux Release build::$MSG"
            exit 1
          fi

      - name: Build & install Linux Release
        run: |
          set -o pipefail
          export CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! ninja -C "$RUNNER_TEMP/build-linux" install 2>&1 | tee "$RUNNER_TEMP/build-linux.log"; then
            MSG="$(tail -n 30 "$RUNNER_TEMP/build-linux.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Build Linux Release::$MSG"
            exit 1
          fi
          ccache -s || true
          rm -rf "$RUNNER_TEMP/build-linux"
          rm -rf lib/linux_x64
          df -h

      - name: Save Linux ccache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-${{ github.sha }}

      - name: Verify headless OpenGL (Mesa llvmpipe)
        run: |
          set -o pipefail
          BLENDER_BIN="$RUNNER_TEMP/pkg/blender-${{ env.ARCHIVE_VERSION }}-linux-x64/blender"
          VER_OUT="$("$BLENDER_BIN" --version)"
          echo "$VER_OUT"
          echo "$VER_OUT" | grep -q "5.2.4 LTS Goo Engine"

          mkdir -p "$RUNNER_TEMP/qa-renders/opengl"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B || true
          if ! GOO_CI_SOFTWARE_GPU=1 \
            GOO_TEST_OUT_DIR="$RUNNER_TEMP/qa-renders/opengl" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BLENDER_BIN" --background --factory-startup --gpu-backend opengl \
            --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py" 2>&1 | tee "$RUNNER_TEMP/qa-opengl.log"; then
            MSG="$(tail -n 30 "$RUNNER_TEMP/qa-opengl.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Verify headless OpenGL::$MSG"
            exit 1
          fi

      - name: Verify headless Vulkan (Mesa lavapipe)
        run: |
          set -o pipefail
          BLENDER_BIN="$RUNNER_TEMP/pkg/blender-${{ env.ARCHIVE_VERSION }}-linux-x64/blender"
          LVP_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          echo "Using Lavapipe ICD: $LVP_ICD"
          VK_ICD_FILENAMES="$LVP_ICD" VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary || true

          mkdir -p "$RUNNER_TEMP/qa-renders/vulkan"
          if ! GOO_CI_SOFTWARE_GPU=1 \
            GOO_TEST_OUT_DIR="$RUNNER_TEMP/qa-renders/vulkan" \
            VK_ICD_FILENAMES="$LVP_ICD" \
            VK_DRIVER_FILES="$LVP_ICD" \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            "$BLENDER_BIN" --background --factory-startup --gpu-backend vulkan \
            --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py" 2>&1 | tee "$RUNNER_TEMP/qa-vulkan.log"; then
            MSG="$(tail -n 30 "$RUNNER_TEMP/qa-vulkan.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Verify headless Vulkan::$MSG"
            exit 1
          fi

      - name: Package Linux portable .tar.xz archive
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          PKG_NAME="blender-${{ env.ARCHIVE_VERSION }}-linux-x64"
          tar -C "$RUNNER_TEMP/pkg" -cf - "$PKG_NAME" | xz -T0 -6 > "$RUNNER_TEMP/dist/$PKG_NAME.tar.xz"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$PKG_NAME.tar.xz" > "$PKG_NAME.tar.xz.sha256")
          ls -lh "$RUNNER_TEMP/dist"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux-x64
          path: |
            ${{ runner.temp }}/dist/blender-*-linux-x64.tar.xz
            ${{ runner.temp }}/dist/blender-*-linux-x64.tar.xz.sha256
          if-no-files-found: error

      - name: Upload Linux OpenGL & Vulkan QA renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux-qa-renders
          path: ${{ runner.temp }}/qa-renders
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 (Release + CLI/Migration QA)
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Free runner disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          Remove-Item -Recurse -Force C:\Android, C:\ghcup, C:\hostedtoolcache\windows\CodeQL, C:\Strawberry -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem

      - name: Enable Git longpaths
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Checkout Blender Goo Engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja & 7-Zip are available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\7-Zip"
          }
          cmake --version
          ninja --version

      - name: Pull bundled LFS assets and precompiled lib/windows_x64
        shell: pwsh
        run: |
          git lfs install --skip-repo
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git lfs pull --exclude="tests/**"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $startupSize = (Get-Item "release\datafiles\startup.blend").Length
          Write-Host "release\datafiles\startup.blend size: $startupSize bytes"
          if ($startupSize -le 1024) {
            throw "release\datafiles\startup.blend is incomplete ($startupSize bytes)"
          }
          Remove-Item -Recurse -Force .git\lfs -ErrorAction SilentlyContinue

          git config --local submodule.lib/windows_x64.update checkout
          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git submodule update --init --depth 1 --progress lib/windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GIT_LFS_SKIP_SMUDGE
          git -C lib/windows_x64 lfs pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path ".git\modules\lib\windows_x64\lfs") {
            Remove-Item -Recurse -Force ".git\modules\lib\windows_x64\lfs"
          }
          if (Test-Path "lib\windows_x64\.git\lfs") {
            Remove-Item -Recurse -Force "lib\windows_x64\.git\lfs"
          }
          if (-not (Test-Path "lib\windows_x64\.git")) {
            throw "lib\windows_x64\.git missing!"
          }
          Get-PSDrive -PSProvider FileSystem

      - name: Configure Windows Release build
        shell: pwsh
        run: |
          $clLine = (cl.exe 2>&1 | Select-Object -First 1) -as [string]
          Write-Host "Detected cl.exe: $clLine"
          $extraCompilerArgs = @()
          if ($clLine -match 'Version\s+(\d+\.\d+\.\d+)') {
            $clVer = [version]$Matches[1]
            if ($clVer -lt [version]'19.44.35216') {
              if (Get-Command clang-cl.exe -ErrorAction SilentlyContinue) {
                Write-Host "cl.exe $clVer < 19.44.35216; using clang-cl"
                $extraCompilerArgs += @('-DCMAKE_C_COMPILER=clang-cl', '-DCMAKE_CXX_COMPILER=clang-cl')
              } else {
                throw "cl.exe $clVer < 19.44.35216 and clang-cl.exe was not found"
              }
            }
          }

          $buildDir = "$($env:RUNNER_TEMP -replace '\\','/')/build-win"
          $installDir = "$($env:RUNNER_TEMP -replace '\\','/')/pkg/blender-${{ env.ARCHIVE_VERSION }}-windows-x64"
          $logFile = "$env:RUNNER_TEMP\cmake-win.log"

          & cmake -S . -B $buildDir -G Ninja `
            @extraCompilerArgs `
            -C build_files/cmake/config/blender_release.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DWITH_WINDOWS_RELEASE_PDB=OFF `
            -DWITH_OPENGL_BACKEND=ON `
            -DWITH_VULKAN_BACKEND=ON `
            -DWITH_CYCLES_CUDA_BINARIES=OFF `
            -DWITH_CYCLES_HIP_BINARIES=OFF `
            -DWITH_CYCLES_ONEAPI_BINARIES=OFF `
            -DWITH_CYCLES_DEVICE_OPTIX=OFF `
            -DWITH_CYCLES_DEVICE_HIPRT=OFF `
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF `
            -DCMAKE_INSTALL_PREFIX="$installDir" 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            $msg = ((Get-Content $logFile -Tail 25) -join "`n").Replace("%","%25").Replace("`r","%0D").Replace("`n","%0A")
            Write-Host "::error title=Configure Windows Release build::$msg"
            exit $LASTEXITCODE
          }

      - name: Build & install Windows Release
        shell: pwsh
        run: |
          $buildDir = "$env:RUNNER_TEMP\build-win"
          $logFile = "$env:RUNNER_TEMP\build-win.log"
          & ninja -C $buildDir -j 4 install 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            $msg = ((Get-Content $logFile -Tail 30) -join "`n").Replace("%","%25").Replace("`r","%0D").Replace("`n","%0A")
            Write-Host "::error title=Build Windows Release::$msg"
            exit $LASTEXITCODE
          }
          Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force lib\windows_x64 -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem

      - name: Verify Windows version string & headless Mesa GPU QA
        shell: pwsh
        run: |
          $pkgDir = "$env:RUNNER_TEMP\pkg\blender-${{ env.ARCHIVE_VERSION }}-windows-x64"
          $verOut = & "$pkgDir\blender.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $verOut
          if (-not ($verOut -match "5\.2\.4 LTS Goo Engine")) {
            throw "Unexpected blender.exe --version output: $verOut"
          }

          $testPkgDir = "$env:RUNNER_TEMP\test-pkg"
          Remove-Item -Recurse -Force $testPkgDir -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force $pkgDir $testPkgDir
          $blenderExe = "$testPkgDir\blender.exe"
          $ciScript = "$env:GITHUB_WORKSPACE\tests\python\goo_engine_ci_test.py"

          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z"
          $mesaArchive = "$env:RUNNER_TEMP\mesa.7z"
          & curl.exe -fSL $mesaUrl -o $mesaArchive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualHash = (Get-FileHash -Path $mesaArchive -Algorithm SHA256).Hash.ToLower()
          $expectedHash = "64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1"
          if ($actualHash -ne $expectedHash) {
            throw "Mesa SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }

          $mesaDir = "$env:RUNNER_TEMP\mesa"
          Remove-Item -Recurse -Force $mesaDir -ErrorAction SilentlyContinue
          & 7z x $mesaArchive "-o$mesaDir" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $mesaDir -Filter "*.7z" | ForEach-Object {
            & 7z x $_.FullName "-o$($_.DirectoryName)" -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $openglDll = Get-ChildItem -Path $mesaDir -Recurse -Filter "opengl32.dll" |
            Where-Object { $_.DirectoryName -match '(?i)[\\/]x64($|[\\/])' } |
            Select-Object -First 1
          if (-not $openglDll) {
            $openglDll = Get-ChildItem -Path $mesaDir -Recurse -Filter "opengl32.dll" | Select-Object -First 1
          }
          if (-not $openglDll) { throw "opengl32.dll not found in extracted Mesa archive" }
          $mesaX64Dir = $openglDll.DirectoryName

          $vkOutDir = "$env:RUNNER_TEMP\qa-renders\vulkan"
          $vulkanLvp = Get-ChildItem -Path $mesaX64Dir -Filter "vulkan_lvp.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vulkanLvp) {
            $lvpIcdJson = "$env:RUNNER_TEMP\lvp_icd_abs.json"
            $icdObj = @{
              file_format_version = "1.0.0"
              ICD = @{
                library_path = $vulkanLvp.FullName
                api_version = "1.3.0"
              }
            }
            $jsonText = $icdObj | ConvertTo-Json -Depth 4
            [System.IO.File]::WriteAllText($lvpIcdJson, $jsonText, (New-Object System.Text.UTF8Encoding($false)))

            $vkRegPath = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
            if (Test-Path $vkRegPath) {
              $item = Get-Item -Path $vkRegPath
              foreach ($valName in $item.GetValueNames()) {
                Remove-ItemProperty -Path $vkRegPath -Name $valName -ErrorAction SilentlyContinue
              }
            } else {
              New-Item -Path $vkRegPath -Force | Out-Null
            }
            New-ItemProperty -Path $vkRegPath -Name $lvpIcdJson -PropertyType DWord -Value 0 -Force | Out-Null

            $origPath = $env:PATH
            $env:PATH = "$origPath;$mesaX64Dir"
            $env:VK_DRIVER_FILES = $lvpIcdJson
            $env:VK_ICD_FILENAMES = $lvpIcdJson
            $env:GOO_CI_SOFTWARE_GPU = "1"
            $env:GOO_TEST_OUT_DIR = $vkOutDir
            New-Item -ItemType Directory -Force -Path $vkOutDir | Out-Null

            $vkLog = "$env:RUNNER_TEMP\qa-win-vulkan.log"
            & $blenderExe --background --factory-startup --gpu-backend vulkan --python-exit-code 1 --python $ciScript 2>&1 | Tee-Object -FilePath $vkLog
            $vkExit = $LASTEXITCODE

            $env:PATH = $origPath
            Remove-Item Env:VK_DRIVER_FILES -ErrorAction SilentlyContinue
            Remove-Item Env:VK_ICD_FILENAMES -ErrorAction SilentlyContinue

            if ($vkExit -ne 0 -or -not (Test-Path "$vkOutDir\goo_ci_goo44_compat.png") -or -not (Test-Path "$vkOutDir\goo_ci_master_showcase.png")) {
              Write-Host "::warning title=Windows Vulkan (lavapipe)::Headless Windows Vulkan check exited with $vkExit; skipping Windows Vulkan screenshots and continuing with mandatory OpenGL."
              Remove-Item -Recurse -Force $vkOutDir -ErrorAction SilentlyContinue
            }
          }

          Get-ChildItem -Path $mesaX64Dir -Filter "*.dll" | Where-Object { $_.Name -notmatch '^vulkan' } | ForEach-Object {
            $dst = Join-Path $testPkgDir $_.Name
            if (-not (Test-Path $dst)) {
              Copy-Item -Path $_.FullName -Destination $dst
            }
          }

          $glOutDir = "$env:RUNNER_TEMP\qa-renders\opengl"
          New-Item -ItemType Directory -Force -Path $glOutDir | Out-Null
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:LIBGL_ALWAYS_SOFTWARE = "1"
          $env:GOO_CI_SOFTWARE_GPU = "1"
          $env:GOO_TEST_OUT_DIR = $glOutDir

          $glLog = "$env:RUNNER_TEMP\qa-win-opengl.log"
          & $blenderExe --background --factory-startup --gpu-backend opengl --python-exit-code 1 --python $ciScript 2>&1 | Tee-Object -FilePath $glLog
          $glExit = $LASTEXITCODE

          Remove-Item -Recurse -Force $testPkgDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $mesaDir -ErrorAction SilentlyContinue
          Remove-Item -Force $mesaArchive, "$env:RUNNER_TEMP\lvp_icd_abs.json" -ErrorAction SilentlyContinue

          if ($glExit -ne 0) {
            $msg = ((Get-Content $glLog -Tail 30) -join "`n").Replace("%","%25").Replace("`r","%0D").Replace("`n","%0A")
            Write-Host "::error title=Verify Windows OpenGL QA::$msg"
            exit $glExit
          }
          if (-not (Test-Path "$glOutDir\goo_ci_goo44_compat.png") -or -not (Test-Path "$glOutDir\goo_ci_master_showcase.png")) {
            Write-Host "::error title=Verify Windows OpenGL QA::Expected OpenGL QA PNG renders were not produced in $glOutDir"
            exit 1
          }

      - name: Package Windows portable .zip archive
        shell: pwsh
        run: |
          $pkgName = "blender-${{ env.ARCHIVE_VERSION }}-windows-x64"
          $pkgDir = "$env:RUNNER_TEMP\pkg\$pkgName"
          $distDir = "$env:RUNNER_TEMP\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $zipPath = "$distDir\$pkgName.zip"
          & 7z a -tzip -mx=5 $zipPath $pkgDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zipPath.sha256" -Value "$hash  $pkgName.zip"
          Get-ChildItem $distDir

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows-x64
          path: |
            ${{ runner.temp }}/dist/blender-*-windows-x64.zip
            ${{ runner.temp }}/dist/blender-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Upload Windows OpenGL & Vulkan QA renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows-qa-renders
          path: ${{ runner.temp }}/qa-renders
          if-no-files-found: ignore

  macos-arm64:
    name: macOS arm64 (Release DMG + Sign + QA)
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Select Xcode 16+ & free runner disk space
        run: |
          set -o pipefail
          {
            set -euo pipefail
            test "$(uname -m)" = "arm64"
            df -h

            CUR_XC_VER="$(xcodebuild -version 2>/dev/null | awk '/Xcode/{print $2}' || true)"
            CUR_XC_MAJ="${CUR_XC_VER%%.*}"
            if [ -z "$CUR_XC_MAJ" ] || ! [ "$CUR_XC_MAJ" -ge 16 ] 2>/dev/null; then
              BEST_XC="$(python3 - <<'PY'
          import glob, plistlib, os
          best = None
          best_ver = (0,)
          for app in glob.glob("/Applications/Xcode*.app"):
              if os.path.islink(app):
                  continue
              plist = os.path.join(app, "Contents", "Info.plist")
              if not os.path.isfile(plist):
                  continue
              with open(plist, "rb") as f:
                  ver_str = plistlib.load(f).get("CFBundleShortVersionString", "0")
              ver = tuple(int(x) for x in ver_str.split(".") if x.isdigit())
              if ver >= (16,) and ver > best_ver:
                  best_ver = ver
                  best = app
          if best:
              print(best)
          PY
          )"
              test -n "$BEST_XC"
              sudo xcode-select -s "$BEST_XC/Contents/Developer"
              sudo xcodebuild -license accept || true
            fi
            xcodebuild -version

            FREE_GB="$(df -g / | awk 'NR==2 {print $4}')"
            echo "Initial free disk on /: ${FREE_GB} GiB"
            if [ "${FREE_GB:-0}" -lt 28 ]; then
              echo "Free space < 28 GiB; removing simulator devices/runtimes and unused caches..."
              xcrun simctl shutdown all || true
              xcrun simctl delete all || true
              sudo xcrun simctl runtime delete all || true
              sudo rm -rf ~/Library/Developer/CoreSimulator /Users/runner/hostedtoolcache/CodeQL /usr/local/share/dotnet || true
            fi
            df -h
            FINAL_FREE_GB="$(df -g / | awk 'NR==2 {print $4}')"
            XC_LINE="$(xcodebuild -version | tr '\n' ' ')"
            echo "::notice title=macOS Runner Env::${XC_LINE} | Free=${FINAL_FREE_GB}GiB"
          } 2>&1 | tee "$RUNNER_TEMP/setup-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/setup-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Select Xcode & free disk::$MSG"
            exit 1
          }

      - name: Install macOS build tools (git-lfs, cmake, ninja, ccache)
        run: |
          set -o pipefail
          {
            set -euo pipefail
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            MISSING=""
            command -v git-lfs >/dev/null 2>&1 || MISSING="$MISSING git-lfs"
            command -v cmake >/dev/null 2>&1 || MISSING="$MISSING cmake"
            command -v ninja >/dev/null 2>&1 || MISSING="$MISSING ninja"
            command -v ccache >/dev/null 2>&1 || MISSING="$MISSING ccache"
            if [ -n "$MISSING" ]; then
              brew install $MISSING
            fi
            cmake --version
            ninja --version
          } 2>&1 | tee "$RUNNER_TEMP/tools-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/tools-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Install macOS build tools::$MSG"
            exit 1
          }

      - name: Checkout Blender Goo Engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Pull bundled LFS assets and precompiled lib/macos_arm64
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git lfs install --skip-repo
            git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
            git lfs pull --exclude="tests/**"
            STARTUP_SIZE="$(wc -c < release/datafiles/startup.blend | tr -d ' ')"
            echo "release/datafiles/startup.blend size: $STARTUP_SIZE bytes"
            test "$STARTUP_SIZE" -gt 1024
            rm -rf .git/lfs

            git config --local submodule.lib/macos_arm64.update checkout
            GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 --progress lib/macos_arm64
            git -C lib/macos_arm64 lfs pull
            rm -rf lib/macos_arm64/.git/lfs .git/modules/lib/macos_arm64/lfs
            test -e lib/macos_arm64/.git
            df -h
          } 2>&1 | tee "$RUNNER_TEMP/lfs-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/lfs-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Pull macOS LFS & lib::$MSG"
            exit 1
          }

      - name: Restore macOS ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: |
            ccache-macos-arm64-

      - name: Configure macOS arm64 Release build
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! cmake -S . -B "$RUNNER_TEMP/build-macos" -G Ninja \
            -C build_files/cmake/config/blender_release.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_COMPILER_CCACHE=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pkg" 2>&1 | tee "$RUNNER_TEMP/cmake-macos.log"; then
            MSG="$(tail -n 25 "$RUNNER_TEMP/cmake-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Configure macOS Release build::$MSG"
            exit 1
          fi

      - name: Build & install macOS arm64 Release
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! ninja -C "$RUNNER_TEMP/build-macos" install 2>&1 | tee "$RUNNER_TEMP/build-macos.log"; then
            MSG="$(tail -n 30 "$RUNNER_TEMP/build-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Build macOS Release::$MSG"
            exit 1
          fi
          ccache -s || true
          rm -rf "$RUNNER_TEMP/build-macos" lib/macos_arm64
          df -h

      - name: Save macOS ccache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-arm64-${{ github.sha }}

      - name: Ad-hoc sign Blender.app & verify Goo Engine
        run: |
          set -o pipefail
          {
            set -euo pipefail
            APP="$RUNNER_TEMP/pkg/Blender.app"
            test -d "$APP"

            APP="$APP" python3 - <<'PY'
          import os
          import struct
          import subprocess
          from pathlib import Path

          app = Path(os.environ["APP"])
          entitlements = Path("release/darwin/entitlements.plist")
          thumb_entitlements = Path("release/darwin/thumbnailer_entitlements.plist")
          macho_magics = {b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca"}

          def is_macho_and_exec(path: Path):
              try:
                  with open(path, "rb") as f:
                      hdr = f.read(16)
              except OSError:
                  return False, False
              if len(hdr) < 4 or hdr[:4] not in macho_magics:
                  return False, False
              if hdr[:4] == b"\xcf\xfa\xed\xfe" and len(hdr) >= 16:
                  filetype = struct.unpack("<I", hdr[12:16])[0]
                  return True, (filetype == 2)
              out = subprocess.check_output(["file", "-b", str(path)], text=True)
              return ("Mach-O" in out), ("executable" in out)

          for sub_name in ("Resources", "Frameworks"):
              sub_dir = app / "Contents" / sub_name
              if not sub_dir.is_dir():
                  continue
              for root, _dirs, files in os.walk(sub_dir):
                  for fname in files:
                      fpath = Path(root) / fname
                      if fpath.is_symlink() or not fpath.is_file():
                          continue
                      is_macho, is_exec = is_macho_and_exec(fpath)
                      if not is_macho:
                          continue
                      cmd = ["codesign", "--force", "--sign", "-"]
                      if is_exec:
                          cmd.extend(["--entitlements", str(entitlements)])
                      cmd.append(str(fpath))
                      subprocess.check_call(cmd)

          thumb = app / "Contents" / "PlugIns" / "blender-thumbnailer.appex"
          if thumb.is_dir():
              subprocess.check_call([
                  "codesign", "--force", "--sign", "-",
                  "--entitlements", str(thumb_entitlements),
                  str(thumb),
              ])

          subprocess.check_call([
              "codesign", "--force", "--sign", "-",
              "--entitlements", str(entitlements),
              str(app),
          ])
          PY

            codesign --verify --deep --strict --verbose=2 "$APP"

            VER_OUT="$("$APP/Contents/MacOS/Blender" --version)"
            echo "$VER_OUT"
            echo "$VER_OUT" | grep -q "5.2.4 LTS Goo Engine"

            GOO_SKIP_GPU_RENDER=1 \
              "$APP/Contents/MacOS/Blender" --background --factory-startup \
              --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py"

            mkdir -p "$RUNNER_TEMP/qa-macos/metal"
            set +e
            GOO_TEST_OUT_DIR="$RUNNER_TEMP/qa-macos/metal" \
              "$APP/Contents/MacOS/Blender" --background --factory-startup \
              --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py"
            METAL_RC=$?
            set -e
            if [ "$METAL_RC" -ne 0 ]; then
              echo "::warning title=macOS CI Metal GPU render::Headless paravirtual Metal render exited $METAL_RC; removing partial macOS CI renders."
              rm -rf "$RUNNER_TEMP/qa-macos/metal"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/verify-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/verify-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Sign & verify macOS Blender.app::$MSG"
            exit 1
          }

      - name: Package macOS portable .dmg archive
        run: |
          set -o pipefail
          {
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/dmg-staging" "$RUNNER_TEMP/dist"
            mv "$RUNNER_TEMP/pkg/Blender.app" "$RUNNER_TEMP/dmg-staging/Blender.app"
            ln -s /Applications "$RUNNER_TEMP/dmg-staging/Applications"
            DMG_NAME="blender-${ARCHIVE_VERSION}-macos-arm64.dmg"
            hdiutil create -volname "Blender 5.2.4 Goo Engine" \
              -srcfolder "$RUNNER_TEMP/dmg-staging" \
              -ov -format UDZO \
              "$RUNNER_TEMP/dist/$DMG_NAME"
            (cd "$RUNNER_TEMP/dist" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
            rm -rf "$RUNNER_TEMP/dmg-staging" "$RUNNER_TEMP/pkg"
            ls -lh "$RUNNER_TEMP/dist"
          } 2>&1 | tee "$RUNNER_TEMP/dmg-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/dmg-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Package macOS DMG::$MSG"
            exit 1
          }

      - name: Upload macOS release archive
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-macos-arm64
          path: |
            ${{ runner.temp }}/dist/blender-*-macos-arm64.dmg
            ${{ runner.temp }}/dist/blender-*-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Upload macOS Metal QA renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-macos-qa-renders
          path: ${{ runner.temp }}/qa-macos
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: [linux-x64, windows-x64, macos-arm64]
    if: success()
    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: goo-engine-linux-x64
          path: release-assets

      - name: Download Windows release archive
        uses: actions/download-artifact@v4
        with:
          name: goo-engine-windows-x64
          path: release-assets

      - name: Download macOS release archive
        uses: actions/download-artifact@v4
        with:
          name: goo-engine-macos-arm64
          path: release-assets

      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "v5.2.4-goo"
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          lines = [
              "Portable release builds of **Blender 5.2.4 LTS Goo Engine** (`goo-port` branch).",
              "",
              "### Downloads",
              f"- **macOS arm64 (Apple Silicon, [`blender-5.2.4-goo-macos-arm64.dmg`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg), [`sha256`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg.sha256))**: Open the `.dmg`, drag `Blender.app` to Applications, and on first launch clear quarantine if Gatekeeper blocks unsigned ad-hoc apps: `xattr -cr /Applications/Blender.app`.",
              f"- **Windows x64 ([`blender-5.2.4-goo-windows-x64.zip`]({base_url}/blender-5.2.4-goo-windows-x64.zip), [`sha256`]({base_url}/blender-5.2.4-goo-windows-x64.zip.sha256))**: Extract anywhere and run `blender.exe` (or `blender-launcher.exe`).",
              f"- **Linux x64 ([`blender-5.2.4-goo-linux-x64.tar.xz`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz), [`sha256`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz.sha256))**: Extract (`tar -xf blender-5.2.4-goo-linux-x64.tar.xz`) and run `./blender`.",
              "",
              "### Automated Verification",
              "Full `tests/python/goo_engine_ci_test.py` suite passed (Goo 3.5 / 4.4 / stock 4.x `.blend` migration, all 13 Goo shader nodes, Bloom, GTAO, SSR + Refraction, SSS, Volumetrics, DoF, Motion Blur, Planar/Sphere/Volume LightProbes, Hair Curves, Light Groups, and stock `BLENDER_EEVEE` sanity):",
              "- **macOS arm64 Release**: Apple Silicon Metal + full `blender_release.cmake` ad-hoc signed `.app` bundle",
              "- **Windows x64 Release**: OpenGL (`llvmpipe`) + Vulkan (`lavapipe`)",
              "- **Linux x64 Release**: OpenGL (`llvmpipe`) + Vulkan (`lavapipe`)",
              "",
              f"See [**Verification Evidence Screenshots**](https://github.com/{repo}/blob/goo-port/README.md#verification-evidence-screenshots) in `README.md` for cross-platform rendered outputs.",
          ]

          Path("release-body.md").write_text("\n".join(lines) + "\n")
          PY

      - name: List release assets
        run: ls -lh release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.4-goo
          target_commitish: ${{ github.sha }}
          name: "Blender 5.2.4 LTS — Goo Engine (Windows x64, Linux x64 & macOS arm64)"
          prerelease: false
          draft: false
          body_path: release-body.md
          files: |
            release-assets/blender-*.dmg
            release-assets/blender-*.dmg.sha256
            release-assets/blender-*.zip
            release-assets/blender-*.zip.sha256
            release-assets/blender-*.tar.xz
            release-assets/blender-*.tar.xz.sha256
