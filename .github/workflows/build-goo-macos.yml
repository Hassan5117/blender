name: Build & Publish Goo Engine macOS arm64 Release

on:
  push:
    branches:
      - goo-port
    paths:
      - ".github/workflows/build-goo-macos.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload macOS DMG to"
        required: false
        default: "v5.2.4-goo"

permissions:
  contents: write

concurrency:
  group: goo-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHIVE_VERSION: "5.2.4-goo"

jobs:
  macos-arm64:
    name: macOS arm64 (Release DMG + Sign + QA)
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Select Xcode 16+ & free runner disk space
        run: |
          set -o pipefail
          {
            set -euo pipefail
            test "$(uname -m)" = "arm64"
            df -h

            CUR_XC_VER="$(xcodebuild -version 2>/dev/null | awk '/Xcode/{print $2}' || true)"
            CUR_XC_MAJ="${CUR_XC_VER%%.*}"
            if [ -z "$CUR_XC_MAJ" ] || ! [ "$CUR_XC_MAJ" -ge 16 ] 2>/dev/null; then
              BEST_XC="$(python3 - <<'PY'
          import glob, plistlib, os
          best = None
          best_ver = (0,)
          for app in glob.glob("/Applications/Xcode*.app"):
              if os.path.islink(app):
                  continue
              plist = os.path.join(app, "Contents", "Info.plist")
              if not os.path.isfile(plist):
                  continue
              with open(plist, "rb") as f:
                  ver_str = plistlib.load(f).get("CFBundleShortVersionString", "0")
              ver = tuple(int(x) for x in ver_str.split(".") if x.isdigit())
              if ver >= (16,) and ver > best_ver:
                  best_ver = ver
                  best = app
          if best:
              print(best)
          PY
          )"
              test -n "$BEST_XC"
              sudo xcode-select -s "$BEST_XC/Contents/Developer"
              sudo xcodebuild -license accept || true
            fi
            xcodebuild -version

            FREE_GB="$(df -g / | awk 'NR==2 {print $4}')"
            echo "Initial free disk on /: ${FREE_GB} GiB"
            if [ "${FREE_GB:-0}" -lt 28 ]; then
              echo "Free space < 28 GiB; removing simulator devices/runtimes and unused caches..."
              xcrun simctl shutdown all || true
              xcrun simctl delete all || true
              sudo xcrun simctl runtime delete all || true
              sudo rm -rf ~/Library/Developer/CoreSimulator /Users/runner/hostedtoolcache/CodeQL /usr/local/share/dotnet || true
            fi
            df -h
            FINAL_FREE_GB="$(df -g / | awk 'NR==2 {print $4}')"
            XC_LINE="$(xcodebuild -version | tr '\n' ' ')"
            echo "::notice title=macOS Runner Env::${XC_LINE} | Free=${FINAL_FREE_GB}GiB"
          } 2>&1 | tee "$RUNNER_TEMP/setup-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/setup-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Select Xcode & free disk::$MSG"
            exit 1
          }

      - name: Install macOS build tools (git-lfs, cmake, ninja, ccache)
        run: |
          set -o pipefail
          {
            set -euo pipefail
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            MISSING=""
            command -v git-lfs >/dev/null 2>&1 || MISSING="$MISSING git-lfs"
            command -v cmake >/dev/null 2>&1 || MISSING="$MISSING cmake"
            command -v ninja >/dev/null 2>&1 || MISSING="$MISSING ninja"
            command -v ccache >/dev/null 2>&1 || MISSING="$MISSING ccache"
            if [ -n "$MISSING" ]; then
              brew install $MISSING
            fi
            cmake --version
            ninja --version
          } 2>&1 | tee "$RUNNER_TEMP/tools-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/tools-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Install macOS build tools::$MSG"
            exit 1
          }

      - name: Checkout Blender Goo Engine source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Pull bundled LFS assets and precompiled lib/macos_arm64
        run: |
          set -o pipefail
          {
            set -euo pipefail
            git lfs install --skip-repo
            git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
            git lfs pull --exclude="tests/**"
            STARTUP_SIZE="$(wc -c < release/datafiles/startup.blend | tr -d ' ')"
            echo "release/datafiles/startup.blend size: $STARTUP_SIZE bytes"
            test "$STARTUP_SIZE" -gt 1024
            rm -rf .git/lfs

            git config --local submodule.lib/macos_arm64.update checkout
            GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 --progress lib/macos_arm64
            git -C lib/macos_arm64 lfs pull
            rm -rf lib/macos_arm64/.git/lfs .git/modules/lib/macos_arm64/lfs
            test -e lib/macos_arm64/.git
            df -h
          } 2>&1 | tee "$RUNNER_TEMP/lfs-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/lfs-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Pull macOS LFS & lib::$MSG"
            exit 1
          }

      - name: Restore macOS ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: |
            ccache-macos-arm64-

      - name: Configure macOS arm64 Release build
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! cmake -S . -B "$RUNNER_TEMP/build-macos" -G Ninja \
            -C build_files/cmake/config/blender_release.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_COMPILER_CCACHE=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pkg" 2>&1 | tee "$RUNNER_TEMP/cmake-macos.log"; then
            MSG="$(tail -n 25 "$RUNNER_TEMP/cmake-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Configure macOS Release build::$MSG"
            exit 1
          fi

      - name: Build & install macOS arm64 Release
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G CCACHE_SLOPPINESS=pch_defines,time_macros
          if ! ninja -C "$RUNNER_TEMP/build-macos" install 2>&1 | tee "$RUNNER_TEMP/build-macos.log"; then
            MSG="$(tail -n 30 "$RUNNER_TEMP/build-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Build macOS Release::$MSG"
            exit 1
          fi
          ccache -s || true
          rm -rf "$RUNNER_TEMP/build-macos" lib/macos_arm64
          df -h

      - name: Save macOS ccache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-macos-arm64-${{ github.sha }}

      - name: Ad-hoc sign Blender.app & verify Goo Engine
        run: |
          set -o pipefail
          {
            set -euo pipefail
            APP="$RUNNER_TEMP/pkg/Blender.app"
            test -d "$APP"

            APP="$APP" python3 - <<'PY'
          import os
          import struct
          import subprocess
          from pathlib import Path

          app = Path(os.environ["APP"])
          entitlements = Path("release/darwin/entitlements.plist")
          thumb_entitlements = Path("release/darwin/thumbnailer_entitlements.plist")
          macho_magics = {b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca"}

          def is_macho_and_exec(path: Path):
              try:
                  with open(path, "rb") as f:
                      hdr = f.read(16)
              except OSError:
                  return False, False
              if len(hdr) < 4 or hdr[:4] not in macho_magics:
                  return False, False
              if hdr[:4] == b"\xcf\xfa\xed\xfe" and len(hdr) >= 16:
                  filetype = struct.unpack("<I", hdr[12:16])[0]
                  return True, (filetype == 2)
              out = subprocess.check_output(["file", "-b", str(path)], text=True)
              return ("Mach-O" in out), ("executable" in out)

          for sub_name in ("Resources", "Frameworks"):
              sub_dir = app / "Contents" / sub_name
              if not sub_dir.is_dir():
                  continue
              for root, _dirs, files in os.walk(sub_dir):
                  for fname in files:
                      fpath = Path(root) / fname
                      if fpath.is_symlink() or not fpath.is_file():
                          continue
                      is_macho, is_exec = is_macho_and_exec(fpath)
                      if not is_macho:
                          continue
                      cmd = ["codesign", "--force", "--sign", "-"]
                      if is_exec:
                          cmd.extend(["--entitlements", str(entitlements)])
                      cmd.append(str(fpath))
                      subprocess.check_call(cmd)

          thumb = app / "Contents" / "PlugIns" / "blender-thumbnailer.appex"
          if thumb.is_dir():
              subprocess.check_call([
                  "codesign", "--force", "--sign", "-",
                  "--entitlements", str(thumb_entitlements),
                  str(thumb),
              ])

          subprocess.check_call([
              "codesign", "--force", "--sign", "-",
              "--entitlements", str(entitlements),
              str(app),
          ])
          PY

            codesign --verify --deep --strict --verbose=2 "$APP"

            VER_OUT="$("$APP/Contents/MacOS/Blender" --version)"
            echo "$VER_OUT"
            echo "$VER_OUT" | grep -q "5.2.4 LTS Goo Engine"

            GOO_SKIP_GPU_RENDER=1 \
              "$APP/Contents/MacOS/Blender" --background --factory-startup \
              --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py"

            mkdir -p "$RUNNER_TEMP/qa-macos/metal" "$RUNNER_TEMP/dist"
            set +e
            GOO_TEST_OUT_DIR="$RUNNER_TEMP/qa-macos/metal" \
              "$APP/Contents/MacOS/Blender" --background --factory-startup \
              --python-exit-code 1 --python "$GITHUB_WORKSPACE/tests/python/goo_engine_ci_test.py"
            METAL_RC=$?
            set -e
            if [ "$METAL_RC" -eq 0 ] \
              && [ -f "$RUNNER_TEMP/qa-macos/metal/goo_ci_goo44_compat.png" ] \
              && [ -f "$RUNNER_TEMP/qa-macos/metal/goo_ci_master_showcase.png" ]; then
              cp "$RUNNER_TEMP/qa-macos/metal/goo_ci_goo44_compat.png" "$RUNNER_TEMP/dist/evidence-macos-arm64-metal-goo44_compat.png"
              cp "$RUNNER_TEMP/qa-macos/metal/goo_ci_master_showcase.png" "$RUNNER_TEMP/dist/evidence-macos-arm64-metal-master_showcase.png"
            else
              echo "::warning title=macOS CI Metal GPU render::Headless paravirtual Metal render exited $METAL_RC; keeping verified Apple Silicon hardware Metal screenshots on release."
            fi
          } 2>&1 | tee "$RUNNER_TEMP/verify-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/verify-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Sign & verify macOS Blender.app::$MSG"
            exit 1
          }

      - name: Package macOS portable .dmg archive
        run: |
          set -o pipefail
          {
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/dmg-staging" "$RUNNER_TEMP/dist"
            mv "$RUNNER_TEMP/pkg/Blender.app" "$RUNNER_TEMP/dmg-staging/Blender.app"
            ln -s /Applications "$RUNNER_TEMP/dmg-staging/Applications"
            DMG_NAME="blender-${ARCHIVE_VERSION}-macos-arm64.dmg"
            hdiutil create -volname "Blender 5.2.4 Goo Engine" \
              -srcfolder "$RUNNER_TEMP/dmg-staging" \
              -ov -format UDZO \
              "$RUNNER_TEMP/dist/$DMG_NAME"
            (cd "$RUNNER_TEMP/dist" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
            rm -rf "$RUNNER_TEMP/dmg-staging" "$RUNNER_TEMP/pkg"
            ls -lh "$RUNNER_TEMP/dist"
          } 2>&1 | tee "$RUNNER_TEMP/dmg-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/dmg-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Package macOS DMG::$MSG"
            exit 1
          }

      - name: Upload macOS release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-macos-arm64
          path: |
            ${{ runner.temp }}/dist/blender-*-macos-arm64.dmg
            ${{ runner.temp }}/dist/blender-*-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Publish macOS DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v5.2.4-goo' }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP"/dist/blender-*-macos-arm64.dmg \
              "$RUNNER_TEMP"/dist/blender-*-macos-arm64.dmg.sha256 \
              --clobber --repo "${{ github.repository }}"

            if [ -f "$RUNNER_TEMP/dist/evidence-macos-arm64-metal-goo44_compat.png" ] \
              && [ -f "$RUNNER_TEMP/dist/evidence-macos-arm64-metal-master_showcase.png" ]; then
              gh release upload "$RELEASE_TAG" \
                "$RUNNER_TEMP"/dist/evidence-macos-*.png \
                --clobber --repo "${{ github.repository }}"
            fi

            gh release view "$RELEASE_TAG" --json assets --repo "${{ github.repository }}" > "$RUNNER_TEMP/release-assets.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          rel = json.loads(Path(os.path.join(os.environ["RUNNER_TEMP"], "release-assets.json")).read_text())
          asset_names = {a["name"] for a in rel.get("assets", [])}
          has_win_vk = (
              "evidence-windows-x64-vulkan-goo44_compat.png" in asset_names
              and "evidence-windows-x64-vulkan-master_showcase.png" in asset_names
          )

          rows = [("Windows x64 — OpenGL (`llvmpipe`)", "windows-x64-opengl")]
          if has_win_vk:
              rows.append(("Windows x64 — Vulkan (`lavapipe`)", "windows-x64-vulkan"))
          rows.extend([
              ("Linux x64 — OpenGL (`llvmpipe`)", "linux-x64-opengl"),
              ("Linux x64 — Vulkan (`lavapipe`)", "linux-x64-vulkan"),
              ("macOS arm64 — Metal", "macos-arm64-metal"),
          ])

          win_vk_note = " + **Vulkan (`lavapipe`)**" if has_win_vk else ""
          lines = [
              "Portable release builds of **Blender 5.2.4 LTS Goo Engine** (`goo-port` branch).",
              "",
              "### Downloads",
              f"- **macOS arm64 (Apple Silicon, [`blender-5.2.4-goo-macos-arm64.dmg`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg), [`sha256`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg.sha256))**: Open the `.dmg`, drag `Blender.app` to Applications, and on first launch clear quarantine if Gatekeeper blocks unsigned ad-hoc apps: `xattr -cr /Applications/Blender.app`.",
              f"- **Windows x64 ([`blender-5.2.4-goo-windows-x64.zip`]({base_url}/blender-5.2.4-goo-windows-x64.zip), [`sha256`]({base_url}/blender-5.2.4-goo-windows-x64.zip.sha256))**: Extract anywhere and run `blender.exe` (or `blender-launcher.exe`).",
              f"- **Linux x64 ([`blender-5.2.4-goo-linux-x64.tar.xz`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz), [`sha256`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz.sha256))**: Extract (`tar -xf blender-5.2.4-goo-linux-x64.tar.xz`) and run `./blender`.",
              "",
              "### Automated Verification",
              "Full `tests/python/goo_engine_ci_test.py` suite passed (Goo 3.5 / 4.4 / stock 4.x `.blend` migration, all 13 Goo shader nodes, Bloom, GTAO, SSR + Refraction, SSS, Volumetrics, DoF, Motion Blur, Planar/Sphere/Volume LightProbes, Hair Curves, Light Groups, and stock `BLENDER_EEVEE` sanity):",
              "- **macOS arm64 Release**: Apple Silicon Metal + full `blender_release.cmake` ad-hoc signed `.app` bundle",
              f"- **Windows x64 Release**: OpenGL (`llvmpipe`){win_vk_note}",
              "- **Linux x64 Release**: OpenGL (`llvmpipe`) + Vulkan (`lavapipe`)",
              "",
              "### Verification Evidence Screenshots",
              "| Platform / Backend | Goo 3.x/4.x Compat & 13 Nodes (`goo44_compat`) | Multi-Effect Showcase (`master_showcase`) |",
              "| :--- | :---: | :---: |",
          ]
          for label, slug in rows:
              c_url = f"{base_url}/evidence-{slug}-goo44_compat.png"
              m_url = f"{base_url}/evidence-{slug}-master_showcase.png"
              lines.append(
                  f"| **{label}** | ![{label} Compat]({c_url}) | ![{label} Showcase]({m_url}) |"
              )

          Path("release-body.md").write_text("\n".join(lines) + "\n")
          PY

            gh release edit "$RELEASE_TAG" \
              --title "Blender 5.2.4 LTS — Goo Engine (Windows x64, Linux x64 & macOS arm64)" \
              --notes-file release-body.md \
              --repo "${{ github.repository }}"
          } 2>&1 | tee "$RUNNER_TEMP/publish-macos.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/publish-macos.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Publish macOS DMG::$MSG"
            exit 1
          }
