name: Sync Goo Engine Release Notes & Clean Assets

on:
  push:
    branches:
      - goo-port
    paths:
      - ".github/workflows/publish-goo-evidence.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to clean & update"
        required: false
        default: "v5.2.4-goo"

permissions:
  contents: write

jobs:
  sync-release:
    name: Clean Release Evidence Assets & Sync Notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Delete evidence PNG assets and update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v5.2.4-goo' }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            REPO="${{ github.repository }}"
            gh release view "$RELEASE_TAG" --json assets --repo "$REPO" > "$RUNNER_TEMP/before-assets.json"

            REPO="$REPO" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPO"]
          tag = os.environ["RELEASE_TAG"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          before = json.loads(Path(os.path.join(os.environ["RUNNER_TEMP"], "before-assets.json")).read_text())
          evidence_assets = [
              a["name"]
              for a in before.get("assets", [])
              if a["name"].startswith("evidence-") and a["name"].endswith(".png")
          ]
          print(f"Found {len(evidence_assets)} evidence PNG asset(s) to delete: {evidence_assets}")

          for name in evidence_assets:
              subprocess.check_call([
                  "gh", "release", "delete-asset", tag, name, "--yes", "--repo", repo,
              ])

          lines = [
              "Portable release builds of **Blender 5.2.4 LTS Goo Engine** (`goo-port` branch).",
              "",
              "### Downloads",
              f"- **macOS arm64 (Apple Silicon, [`blender-5.2.4-goo-macos-arm64.dmg`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg), [`sha256`]({base_url}/blender-5.2.4-goo-macos-arm64.dmg.sha256))**: Open the `.dmg`, drag `Blender.app` to Applications, and on first launch clear quarantine if Gatekeeper blocks unsigned ad-hoc apps: `xattr -cr /Applications/Blender.app`.",
              f"- **Windows x64 ([`blender-5.2.4-goo-windows-x64.zip`]({base_url}/blender-5.2.4-goo-windows-x64.zip), [`sha256`]({base_url}/blender-5.2.4-goo-windows-x64.zip.sha256))**: Extract anywhere and run `blender.exe` (or `blender-launcher.exe`).",
              f"- **Linux x64 ([`blender-5.2.4-goo-linux-x64.tar.xz`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz), [`sha256`]({base_url}/blender-5.2.4-goo-linux-x64.tar.xz.sha256))**: Extract (`tar -xf blender-5.2.4-goo-linux-x64.tar.xz`) and run `./blender`.",
              "",
              "### Automated Verification",
              "Full `tests/python/goo_engine_ci_test.py` suite passed (Goo 3.5 / 4.4 / stock 4.x `.blend` migration, all 13 Goo shader nodes, Bloom, GTAO, SSR + Refraction, SSS, Volumetrics, DoF, Motion Blur, Planar/Sphere/Volume LightProbes, Hair Curves, Light Groups, and stock `BLENDER_EEVEE` sanity):",
              "- **macOS arm64 Release**: Apple Silicon Metal + full `blender_release.cmake` ad-hoc signed `.app` bundle",
              "- **Windows x64 Release**: OpenGL (`llvmpipe`) + Vulkan (`lavapipe`)",
              "- **Linux x64 Release**: OpenGL (`llvmpipe`) + Vulkan (`lavapipe`)",
              "",
              f"See [**Verification Evidence Screenshots**](https://github.com/{repo}/blob/goo-port/README.md#verification-evidence-screenshots) in `README.md` for cross-platform rendered outputs.",
          ]

          Path("release-body.md").write_text("\n".join(lines) + "\n")
          PY

            gh release edit "$RELEASE_TAG" \
              --title "Blender 5.2.4 LTS — Goo Engine (Windows x64, Linux x64 & macOS arm64)" \
              --notes-file release-body.md \
              --repo "$REPO"

            gh release view "$RELEASE_TAG" --json assets --repo "$REPO" > "$RUNNER_TEMP/after-assets.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          after = json.loads(Path(os.path.join(os.environ["RUNNER_TEMP"], "after-assets.json")).read_text())
          names = [a["name"] for a in after.get("assets", [])]
          leftover = [n for n in names if n.startswith("evidence-") and n.endswith(".png")]
          assert not leftover, f"Leftover evidence PNGs remain: {leftover}"
          summary = ", ".join(names)
          print(f"::notice title=Release Assets Cleaned::Remaining assets ({len(names)}): {summary}")
          PY
          } 2>&1 | tee "$RUNNER_TEMP/sync.log" || {
            MSG="$(tail -n 30 "$RUNNER_TEMP/sync.log" | python3 -c 'import sys; s=sys.stdin.read()[-3500:]; print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")')"
            echo "::error title=Sync Release Notes & Clean Assets::$MSG"
            exit 1
          }
